<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/assets/vendor/compromise.js"></script>
    <title>nw Editor</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="app-shell">
      <header class="app-header" role="banner">
        <div class="header-side">
          <button
            id="menu-button"
            class="menu-icon-button"
            type="button"
            aria-label="Open menu"
            title="Settings"
          >
            ≡
          </button>
        </div>
        <h1 class="file-name" id="file-name">
          <span
            id="unsaved-indicator"
            class="unsaved-indicator"
            aria-hidden="true"
            >●</span
          >
          <span id="filename-text">untitled.txt</span>
        </h1>
        <div class="header-actions">
          <div class="focus-control" id="focus-control">
            <button
              id="focus-toggle-button"
              class="focus-icon-button"
              type="button"
              aria-label="Toggle focus mode"
              aria-pressed="false"
              title="Toggle focus mode (Ctrl/Cmd+Shift+F)"
            >
              ○
            </button>
            <button
              id="focus-menu-button"
              class="focus-menu-button"
              type="button"
              aria-label="Select focus level"
              aria-expanded="false"
              aria-controls="focus-level-menu"
              title="Choose focus level"
            >
              ⌄
            </button>
            <div
              id="focus-level-menu"
              class="focus-level-menu"
              role="menu"
              hidden
            >
              <button
                type="button"
                class="focus-level-option"
                data-focus-level="paragraph"
                role="menuitemradio"
                aria-checked="true"
              >
                Paragraph
              </button>
              <button
                type="button"
                class="focus-level-option"
                data-focus-level="sentence"
                role="menuitemradio"
                aria-checked="false"
              >
                Sentence
              </button>
            </div>
          </div>
        </div>
      </header>

      <div id="menu-screen" class="menu-screen" hidden>
        <div class="menu-header">
          <button
            id="menu-close-button"
            class="menu-close-button"
            type="button"
            aria-label="Close menu"
            title="Close"
          >
            ←
          </button>
          <h2 class="menu-title">Settings</h2>
          <div class="menu-header-spacer"></div>
        </div>

        <div class="menu-icons">
          <button
            class="menu-icon-tab active"
            data-tab="typography"
            aria-label="Typography settings"
            title="Typography"
          >
            <svg viewBox="0 0 256 256" aria-hidden="true" focusable="false">
              <path
                d="M128,96H232a8,8,0,0,1,0,16H128a8,8,0,0,1,0-16Zm104,32H128a8,8,0,0,0,0,16H232a8,8,0,0,0,0-16Zm0,32H80a8,8,0,0,0,0,16H232a8,8,0,0,0,0-16Zm0,32H80a8,8,0,0,0,0,16H232a8,8,0,0,0,0-16ZM96,144a8,8,0,0,0,0-16H88V64h32v8a8,8,0,0,0,16,0V56a8,8,0,0,0-8-8H32a8,8,0,0,0-8,8V72a8,8,0,0,0,16,0V64H72v64H64a8,8,0,0,0,0,16Z"
              />
            </svg>
          </button>
          <button
            class="menu-icon-tab"
            data-tab="syntax"
            aria-label="Syntax highlight settings"
            title="Syntax Highlight"
          >
            <svg viewBox="0 0 256 256" aria-hidden="true" focusable="false">
              <path
                d="M253.66,106.34a8,8,0,0,0-11.32,0L192,156.69,107.31,72l50.35-50.34a8,8,0,1,0-11.32-11.32L96,60.69A16,16,0,0,0,93.18,79.5L72,100.69a16,16,0,0,0,0,22.62L76.69,128,18.34,186.34a8,8,0,0,0,3.13,13.25l72,24A7.88,7.88,0,0,0,96,224a8,8,0,0,0,5.66-2.34L136,187.31l4.69,4.69a16,16,0,0,0,22.62,0l21.19-21.18A16,16,0,0,0,203.31,168l50.35-50.34A8,8,0,0,0,253.66,106.34ZM93.84,206.85l-55-18.35L88,139.31,124.69,176ZM152,180.69,83.31,112,104,91.31,172.69,160Z"
              />
            </svg>
          </button>
        </div>

        <div class="menu-divider"></div>

        <div class="menu-content">
          <div class="menu-section" data-tab="typography">
            <div class="menu-setting">
              <label class="menu-label">Font</label>
              <div class="font-options">
                <button
                  class="font-option active"
                  data-font="inter"
                  type="button"
                >
                  Inter (Sans)
                </button>
                <button
                  class="font-option"
                  data-font="plex-serif"
                  type="button"
                >
                  IBM Plex Serif
                </button>
              </div>
            </div>
          </div>

          <div class="menu-section" data-tab="syntax">
            <div class="menu-setting">
              <label class="menu-label">Syntax Highlight</label>
              <p class="menu-help-text">
                Syntax highlighting is tied to Focus Mode for now.
              </p>
              <div class="syntax-options">
                <div class="syntax-pos-item">
                  <button
                    class="syntax-pos-option is-enabled"
                    data-pos="noun"
                    type="button"
                  >
                    Nouns
                  </button>
                  <span
                    class="syntax-color-swatch syntax-color-noun"
                    aria-hidden="true"
                  ></span>
                </div>
                <div class="syntax-pos-item">
                  <button
                    class="syntax-pos-option is-enabled"
                    data-pos="verb"
                    type="button"
                  >
                    Verbs
                  </button>
                  <span
                    class="syntax-color-swatch syntax-color-verb"
                    aria-hidden="true"
                  ></span>
                </div>
                <div class="syntax-pos-item">
                  <button
                    class="syntax-pos-option is-enabled"
                    data-pos="adjective"
                    type="button"
                  >
                    Adjectives
                  </button>
                  <span
                    class="syntax-color-swatch syntax-color-adjective"
                    aria-hidden="true"
                  ></span>
                </div>
                <div class="syntax-pos-item">
                  <button
                    class="syntax-pos-option is-enabled"
                    data-pos="adverb"
                    type="button"
                  >
                    Adverbs
                  </button>
                  <span
                    class="syntax-color-swatch syntax-color-adverb"
                    aria-hidden="true"
                  ></span>
                </div>
                <div class="syntax-pos-item">
                  <button
                    class="syntax-pos-option is-enabled"
                    data-pos="conjunction"
                    type="button"
                  >
                    Conjunctions
                  </button>
                  <span
                    class="syntax-color-swatch syntax-color-conjunction"
                    aria-hidden="true"
                  ></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <main class="editor-layout" role="main">
        <section class="editor-container" aria-label="Text editor">
          <div
            id="editor"
            class="editor-surface"
            contenteditable="true"
            spellcheck="false"
            aria-label="Editor content"
          ></div>
        </section>
      </main>

      <footer class="app-footer" role="contentinfo">
        <div class="footer-spacer"></div>
        <div class="footer-stats">
          <span id="word-count" class="word-count">0 words</span>
        </div>
      </footer>
    </div>
  </body>
</html>
